# Render blueprint - deploys the Streamlit app as a web service.
#
# The API key is NOT set here. "sync: false" tells Render to leave it blank so
# you enter the real value in the dashboard (Environment tab). It is never
# committed, which is the whole point.
#
# Deploy: Render dashboard -> New -> Blueprint -> point at this repo.
# Or: New -> Web Service -> connect repo -> Render reads this file automatically.

services:
  - type: web
    name: hdfc-mf-facts-bot
    runtime: python
    plan: free
    region: singapore

    # The vector store (chroma_db/) is committed to the repo, so ingestion does
    # NOT run at startup.
    #
    # This is a memory decision, not just a speed one. Running ingest as part of
    # the start command puts a second Python process in the container, and it
    # downloads the ~90 MB embedding model during boot - which is exactly where
    # the container was being OOM-killed at 512 MiB. The app also no longer
    # depends on Groww being reachable from Render's datacenter IP.
    #
    # If you change the corpus, rebuild the store and commit it:
    #   python src/ingest.py --rebuild && git add -A && git commit -m "..."
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: >
      streamlit run app.py
      --server.port $PORT
      --server.address 0.0.0.0
      --server.headless true
      --server.fileWatcherType none
      --browser.gatherUsageStats false

    healthCheckPath: /

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

      # Filled in by you in the Render dashboard. Never committed.
      - key: GROQ_API_KEY
        sync: false

      # Optional override; the default in src/generator.py already matches.
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
